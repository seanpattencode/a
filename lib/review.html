<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>a review</title>
<style>body{margin:0;background:#000;color:#fff;font:20px ui-monospace,monospace;padding:24px 24px 66vh}#ms{position:fixed;right:10px;bottom:10px;color:#888;font-size:13px}.op{background:#111;color:#fff;border:1px solid #666;border-radius:8px;padding:8px 14px;font:16px ui-monospace,monospace;touch-action:manipulation}
#pull{display:none;position:fixed;left:0;right:0;bottom:0;height:62vh;background:#000;border-top:2px solid #444;z-index:9;flex-direction:column}#pw{flex:1;overflow:auto;position:relative}#ps{position:relative;width:100%;height:100%}#pf{position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:#000;transform-origin:0 0}#pb{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;border-top:1px solid #222}#pt{color:#888;font-size:13px;flex:1}#pd{position:absolute;left:0;top:0;right:0;bottom:0;overflow:auto;padding:16px 16px 80px;white-space:pre-wrap;word-break:break-word;font:15px/1.4 ui-monospace,monospace;color:#fff;background:#000}#px{position:absolute;right:8px;top:6px;z-index:10;padding:2px 10px;font-size:22px;line-height:1}#fl{position:fixed;left:10px;bottom:10px;display:flex;gap:8px;align-items:center;z-index:1}#fc{color:#888;font-size:13px}</style>
<!-- a review (Sean 2026-09-02): a done outputs awaiting his decision; grows only by scream. route: serve.c GET /review. button = pull-up web terminal (/op) of the agent's tmux window, bottom-anchored, height not width (Sean 09-03: vertical works for mobile).
     fit width (Sean 09-03, settings button, remembered per browser): a tmux window has ONE size and the frame attaches ignore-size, so it never resizes the host; instead the frame's grid is set to the host's exact cols x rows and scaled so those cols fill the panel, scrolling vertically, opened at the bottom -->
<div style="color:#888;margin-bottom:8px">a review · every repo's <b>a done</b>, newest first · the button under a row opens that agent's conversation in a terminal pulled up from the bottom · no decision marks yet</div><div id=ms></div><div id=armp style="margin:0 0 12px;color:#888">picker: …</div>
<div id=fl><button class=op onpointerdown="fshow(-1,performance.now())">&#8249; prev (k)</button><span id=fc></span><button class=op onpointerdown="fshow(1,performance.now())">next &#8250; (j)</button><button class=op id=fa onpointerdown="ftog()"></button></div>
<div id=pull><button class=op id=px onpointerdown="cl()" title="close">&#10005;</button><div id=pw><div id=ps><iframe id=pf></iframe><div id=pd hidden></div></div></div><div id=pb><span id=pt></span><button class=op id=cb onpointerdown="cp()">copy text</button><button class=op id=fb onpointerdown="fitTog()"></button><button class=op onpointerdown="cl()">&#10005; close</button></div></div>
<script>var t0=performance.now();requestAnimationFrame(function(){requestAnimationFrame(function(){ms.textContent=(performance.now()-t0).toFixed(3)+'ms paint'})});
var FIT=1,HC=0,HR=0,HN='',HW='',TR=0;try{FIT=localStorage.rvfit==='0'?0:1}catch(e){}fb.textContent='fit width: '+(FIT?'on':'off');
function fitTog(){FIT=FIT?0:1;try{localStorage.rvfit=FIT}catch(e){}fb.textContent='fit width: '+(FIT?'on':'off');fitApply()}
function font(){var d=pf.contentDocument,sc=d&&d.getElementById('scr');if(!sc||!sc.style.font)return 0;var e=d.createElement('span');e.style.cssText='position:absolute;visibility:hidden;white-space:pre;font:'+sc.style.font;e.textContent='0000000000';d.body.appendChild(e);var w=e.getBoundingClientRect().width/10;e.remove();var m=/\/(\d+\.?\d*)px/.exec(sc.style.font);return{cw:w,lh:m?+m[1]:w*2}}
function fitApply(){if(!HW)return;var t=performance.now(),f=FIT&&HC?font():0,s=1,W='100%',H='100%';
  if(f){var iw=HC*f.cw+2,ih=HR*f.lh;s=pw.clientWidth/iw;W=iw*s+'px';H=ih*s+'px';pf.style.width=iw+'px';pf.style.height=ih+'px'}else{pf.style.width=pf.style.height='100%'}
  pf.style.transform='scale('+s+')';ps.style.width=W;ps.style.height=H;pw.scrollTop=pw.scrollHeight;
  pt.textContent=HN+' · tmux window '+HW+(HC?' · host '+HC+'x'+HR:'')+(f?' · scale '+s.toFixed(3):FIT&&HC?' · measuring':'')+' · '+(performance.now()-t).toFixed(3)+'ms';
  if(FIT&&HC&&!f&&TR++<12)setTimeout(fitApply,250)}   /* the frame's terminal sets its font a moment after load; retry until measurable */
function op(b){DOCU='';HC=HR=0;TR=0;HN=b.dataset.n;HW=b.dataset.w;pull.style.display='flex';fitApply();pd.hidden=true;pf.hidden=false;pf.removeAttribute('srcdoc');pf.src='/op?w='+HW+'&all';
  fetch('/review/wsz?w='+HW).then(function(r){return r.text()}).then(function(x){var a=x.split(' ');HC=+a[0]||0;HR=+a[1]||0;fitApply()});pf.onload=function(){setTimeout(fitApply,300)}}
function armed(){fetch('/review/armed').then(function(r){return r.text()}).then(function(x){armp.textContent=x?'\u26a1 ARMED: the next Attach click in any browser attaches '+x:'\u2717 unarmed: the next Attach click opens the e picker'})}armed();
var DOCU='';function cp(){var t=performance.now();if(!DOCU){pt.textContent='nothing to copy: open a document first';return}fetch(DOCU+'&raw=1').then(function(r){return r.text()}).then(function(x){var done=function(ok){pt.textContent=(ok?'copied '+x.length+' chars':'copy failed')+' · '+(performance.now()-t).toFixed(3)+'ms'};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(x).then(function(){done(1)},function(){done(0)});else{var a=document.createElement('textarea');a.value=x;a.style.cssText='position:fixed;left:-9999px';document.body.appendChild(a);a.select();var ok=0;try{ok=document.execCommand('copy')}catch(e){}a.remove();done(ok)}})}   /* copy button (Sean 09-03): raw text of the open document; execCommand fallback for http over the LAN, where the clipboard API is absent */
function dv(b){var t=performance.now(),u=b.dataset.u,d=u.indexOf('/review/diff')===0;HC=HR=0;TR=0;HW='';HN=b.dataset.n;pull.style.display='flex';pf.style.transform='';pf.style.width=pf.style.height='100%';ps.style.width=ps.style.height='100%';DOCU=d?'':u;
  var op,sh=function(x,how){pd.innerHTML=x.split('</style>').pop();requestAnimationFrame(function(){requestAnimationFrame(function(){pt.textContent='diff · '+HN+' · opened '+op.toFixed(3)+'ms · painted '+(performance.now()-t).toFixed(3)+'ms'+how})})};   /* every interaction timed (Sean 09-04): opened = the DOM action, painted = two frames later; a diff renders into a div, not a frame */
  pd.hidden=!d;pf.hidden=d;if(d){pf.src='about:blank';if(DC[u])sh(DC[u],' (prefetched)');else{pd.textContent='';fetch(u).then(function(r){return r.text()}).then(function(x){DC[u]=x;sh(x,' (fetched now)')})}}
  else{pf.onload=function(){pt.textContent='document · '+HN+' · opened '+op.toFixed(3)+'ms · shown '+(performance.now()-t).toFixed(3)+'ms'};pf.src=u}
  op=performance.now()-t;pt.textContent=(d?'diff':'document')+' · '+HN+' · opened '+op.toFixed(3)+'ms · loading';if(!d&&!/\.(txt|md)$/i.test(HN))fetch(b.dataset.u.replace('/review/doc','/review/arm')).then(function(r){return r.text()}).then(function(x){pt.textContent='document · '+HN+' · \u26a1 '+x+' for the next Attach click';armed()})}   /* viewing a file arms it (auto arm like resume); text drafts are pasted, not attached, so they stay unarmed */   /* <doc> files: pdf/html/images render natively, text as text */
addEventListener('resize',function(){if(pull.style.display==='flex')fitApply()});
/* flip (Sean 09-04): one a done at a time, j/k or arrows or space, a = all rows; rows are the C-generated divs after this template, so bind on DOMContentLoaded; op = the DOM toggle, painted = after two frames */
var FL=1,RW=[],K=0,DC={};function tm(s,t){ms.textContent=s+' · '+(performance.now()-t).toFixed(3)+'ms'}function go(b){var t=performance.now();ms.textContent='local terminal · switching';fetch('/review/go?w='+b.dataset.w).then(function(r){return r.text()}).then(function(x){tm('local terminal: '+x,t)})}   /* the local terminal app: the switch runs server-side, the stamp is the round trip */
function cl(){var t=performance.now();pull.style.display='none';pf.src='about:blank';pd.textContent='';tm('closed',t)}
function pre(k){var b=RW[k]&&RW[k].querySelector('button[data-u^="/review/diff"]');if(!b||DC[b.dataset.u]!==undefined)return;var u=b.dataset.u,t=performance.now();DC[u]='';fetch(u).then(function(r){return r.text()}).then(function(x){DC[u]=x;tm('diff prefetched for '+(k+1),t)})}   /* the slow part (a diff in the repo) runs off the action path: fetched when an entry becomes current, so the button renders from cache */
try{FL=localStorage.rvflip==='0'?0:1}catch(e){}
function fshow(d,t){K=Math.max(0,Math.min(RW.length-1,K+d));RW.forEach(function(r,i){r.hidden=FL&&i!=K});var op=performance.now()-t;pre(K);pre(K+1);fc.textContent=(FL?(K+1)+' of ':'all ')+RW.length;requestAnimationFrame(function(){requestAnimationFrame(function(){fc.textContent+=' · op '+op.toFixed(3)+'ms · painted '+(performance.now()-t).toFixed(3)+'ms'})})}
function ftog(){FL=FL?0:1;try{localStorage.rvflip=FL}catch(e){}fa.textContent=FL?'all (a)':'flip (a)';fshow(0,performance.now())}
addEventListener('DOMContentLoaded',function(){RW=[].slice.call(document.querySelectorAll('body>div[style^="padding:8px 0;border-bottom"]'));fa.textContent=FL?'all (a)':'flip (a)';fshow(0,performance.now())});
addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;var t=performance.now(),k=e.key;if(k==='j'||k==='ArrowRight'||k===' ')fshow(1,t);else if(k==='k'||k==='ArrowLeft')fshow(-1,t);else if(k==='a')ftog();else return;e.preventDefault()});</script>
