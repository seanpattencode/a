<!DOCTYPE html>
<meta charset="utf-8">
<title>a</title>
<style>
  html, body { margin: 0; height: 100vh; background: #000; color: #eee;
               font-family: system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  iframe { flex: 1; border: 0; width: 100%; background: #000; }
  #tiles { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px;
           justify-content: center; background: #0a0a0a; border-top: 1px solid #222; }
  .tile { display: flex; align-items: center; gap: 4px; }
  .tile a { color: #eee; font-size: 14px; padding: 8px 14px; background: #1a1a1a;
            border-radius: 6px; text-decoration: none; }
  .tile a:hover { background: #2a2a2a; }
  .tile button { background: transparent; color: #666; border: none;
                 font-size: 14px; cursor: pointer; padding: 2px 4px; }
  .tile button:hover { color: #f88; }
  #add { background: transparent; color: #8af; border: 1px dashed #444;
         font-size: 14px; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  #add:hover { background: #1a1a1a; }
</style>
<iframe src="http://localhost:1111/" id="frame"></iframe>
<div id="tiles"></div>
<button id="add" style="position:fixed;right:10px;bottom:10px">+ Add</button>
<script src="newtab.js"></script>
