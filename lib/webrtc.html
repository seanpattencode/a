<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,interactive-widget=resizes-content"><title>a webrtc</title>
<style>body{margin:0;background:#000;color:#fff;font:16px monospace;display:flex;flex-direction:column;height:100dvh}#log{flex:1;overflow:auto;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}iframe{flex:3;min-height:0;width:100%;border:0}#bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}input,button,select{font:inherit;background:#111;color:inherit;border:1px solid #777;padding:10px;min-width:0}details{width:100%}button:disabled{opacity:.4}video{width:48%;max-height:35vh}</style>
<div><video id=far autoplay playsinline controls hidden></video><video id=near autoplay playsinline muted hidden></video></div><iframe id=term src="/op?rtc" title=Shell hidden></iframe><div id=log></div>
<div id=bar><details id=pair open><summary>Pair devices</summary><p>Enter this code on the other device within 90s.</p><button id=offer>Create code</button><input id=peer placeholder=Code aria-label=Code maxlength=6 autocapitalize=characters><button id=use>Connect</button><button id=copy disabled>Copy</button><button id=stop>Disconnect</button></details><select id=mode aria-label=Mode><option value=msg>Messages</option><option value=cmd>Commands</option><option value=shell>Shell</option></select><button id=grant hidden>Share shell (10 min)</button><input id=cmd placeholder="Message or command"><button id=send disabled>Send</button><button id=run hidden disabled>Approve command</button><button id=deny hidden disabled>Reject command</button><button id=audio disabled>Microphone</button><button id=video disabled>Camera</button><span id=ms></span></div>
<script>
const media=['audio','video'];
const L=m=>{log.textContent+='\n'+m;log.scrollTop=log.scrollHeight},V=s=>btoa(unescape(encodeURIComponent(s)));
let p,d,C,A,W,sid='',ok=false,q=null,sent=0;const frame=new Promise(r=>term.onload=()=>r(frames[0]));
const help=(e,b)=>L(e+'\nUse HTTPS/localhost. '+(media.includes(b?.id)?'Allow camera/mic in app/site settings; retry. Close camera apps.':b==run||b==grant?'Check remote output; restart a serve, reconnect, then retry.':'Check internet. Android Settings > Apps > a app/browser > Permissions > Nearby devices > Allow. Create a new code. Try the same Wi-Fi; relaying is not configured.'));
const on=(b,f,e='onpointerdown')=>b[e]=async()=>{const t=performance.now();try{await f()}catch(e){if(e.name!='AbortError'){if(b==offer||b==use)close();help(e,b)}}ms.textContent=(performance.now()-t).toFixed(3)+' ms'};
const tx=(m,c=d)=>c?.readyState=='open'&&c.send(JSON.stringify(m)),lock=v=>run.disabled=deny.disabled=v,ui=()=>{const m=mode.value;grant.disabled=audio.disabled=video.disabled=!ok;send.disabled=!ok||m=='cmd'&&sent;grant.hidden=!(cmd.hidden=send.hidden=m=='shell');run.hidden=deny.hidden=m!='cmd'};
function rtc(s){if(sid)W?W.readyState==1&&W.send(s):tx({shell:sid,input:s})}
function end(){if(!sid)return;const id=sid;sid='';W?.close();W=null;term.hidden=true;grant.textContent='Share shell (10 min)';tx({shell:id,end:1});L('Shell ended')}
function show(id,until){until=new Date(until).toLocaleTimeString();sid=id;mode.value='shell';term.hidden=false;grant.textContent='End shell by '+until;ui();frame.then(w=>{w.reset();w.fit()});L((W?'Sharing':'Remote')+' shell until '+until)}
function close(){A?.abort();p?.getSenders().forEach(s=>s.track?.stop());near.srcObject=far.srcObject=null;near.hidden=far.hidden=true;p?.close();p=d=null;end();mode.value='msg';ok=false;q=null;sent=0;lock(true);ui();copy.disabled=true;pair.open=true;offer.disabled=use.disabled=false;L('Disconnected')}
function start(c=crypto.randomUUID().slice(0,6).toUpperCase()){C=c;offer.disabled=use.disabled=true;L('Pairing…');A=new AbortController;p=new RTCPeerConnection({bundlePolicy:'max-bundle',iceServers:[{urls:'stun:stun.cloudflare.com'}]});p.ontrack=e=>{(far.srcObject??=new MediaStream).addTrack(e.track);e.track.onunmute=()=>far.hidden=false};p.ondatachannel=e=>wire(e.channel);p.onconnectionstatechange=e=>{const s='Connection: '+e.target.connectionState;if(/failed|disconnected/.test(s)){close();help(s)}else L(s)}}
async function local(){if(!p.remoteDescription)for(const k of media)p.addTransceiver(k).setCodecPreferences(RTCRtpSender.getCapabilities(k).codecs.filter(c=>/opus|VP8/.test(c.mimeType)));else p.getTransceivers().forEach(t=>t.direction='sendrecv');await p.setLocalDescription();await new Promise(r=>p.onicecandidate=({candidate:c})=>{if(!c||c.type=='srflx'&&!c.address.includes(':'))r()});return p.localDescription}
async function signal(op,s){const r=await fetch('https://demo.seanpatten.com/rtcpair',{method:'POST',signal:A.signal,body:C+'\n'+op+'\n'+(s?JSON.stringify(s):'')});if(!r.ok)throw Error(await r.text());if(!op){peer.value=C;copy.disabled=false;L('Pairing code: '+C)}if(op!=2)return r.json()}
function wire(c){d=c;d.onopen=()=>tx({code:C});d.onclose=()=>d==c&&(close(),help('Peer disconnected'));
 d.onmessage=e=>{const m=JSON.parse(e.data),id=m.shell;if(!ok){if(m.code!==C){L('CODE MISMATCH');close();return}ok=true;ui();pair.open=false;L('Connected: '+C);return}
 if(id){if(m.until&&sid&&id!=sid)tx({shell:id,end:1});else if(m.end&&id==sid)end();else if(m.until&&!sid)show(id,m.until);else if(id==sid){if(typeof m.input=='string'&&m.input.length<1024&&W?.readyState==1)W.send(m.input);else if(typeof m.term=='string'&&!W)frame.then(w=>w.feed(m.term))}return}
 if(typeof m.msg=='string')return L('Peer: '+m.msg);
 if(typeof m.cmd=='string'){if(mode.value!='cmd'||q!==null){tx({out:'Commands unavailable: message mode or busy',exit:1});L('Refused: '+m.cmd);return}q=m.cmd;L('Peer command:\n'+q);lock(false)}else if(typeof m.out=='string'){L('Peer result: '+m.out+'\nexit '+m.exit+'; '+(performance.now()-sent).toFixed(3)+' ms including approval');sent=0;ui()}}}
on(offer,async()=>{start();wire(p.createDataChannel('a'));await p.setRemoteDescription(await signal(0,await local()))});
on(use,async()=>{const c=peer.value.trim().toUpperCase();if(!/^[0-9A-F]{6}$/.test(c))throw Error('Enter the other device’s code');start(c);await p.setRemoteDescription(await signal(1));await signal(2,await local())});
on(copy,()=>navigator.clipboard.writeText(C));on(stop,close);
for(const k of media)on(window[k],async()=>{const pc=p,s=p.getTransceivers().find(t=>t.receiver.track.kind==k).sender,t=s.track?null:(await navigator.mediaDevices.getUserMedia({[k]:true})).getTracks()[0];s.track?.stop();if(p!=pc){t?.stop();return}await s.replaceTrack(t).catch(e=>{t?.stop();throw e});if(k=='video'){near.hidden=!t;near.srcObject=t?new MediaStream([t]):null}L(k+(t?' on':' off'))});
on(send,()=>{if(send.disabled||!cmd.value.trim())return;tx({[mode.value]:cmd.value});L((mode.value=='cmd'?'Command: ':'You: ')+cmd.value);if(mode.value=='cmd')sent=performance.now();cmd.value='';ui()});
on(mode,()=>{end();if(!run.disabled)deny.onpointerdown();ui();if(mode.value=='shell')L('Share shell on the device to control')},'onchange');
on(grant,()=>{if(sid)return end();if(!ok||!confirm('Give the peer shell control for 10 minutes without per-command approval?'))return;const id=crypto.randomUUID(),until=Date.now()+6e5,w=new WebSocket('ws://'+location.host+'/shell?600'),utf8=new TextDecoder;W=w;show(id,until);w.binaryType='arraybuffer';w.onopen=()=>tx({shell:id,until});w.onmessage=e=>{const s=utf8.decode(e.data,{stream:true});frame.then(t=>t.feed(s));tx({shell:id,term:s})};w.onerror=()=>help('Shell failed',grant);w.onclose=()=>W==w&&end()});
on(deny,()=>{q=null;lock(true);tx({out:'Rejected by receiver',exit:1});L('Rejected')});
on(run,async()=>{if(!ok||q===null)return;const c=d;lock(true);const r=await fetch('/api/omni',{method:'POST',body:new URLSearchParams({q:'webrtc run '+V(q)})});const t=await r.text(),m=JSON.parse(t.slice(t.indexOf('>')+1,t.lastIndexOf('</pre>')));q=null;tx(m,c);L(m.out+'\nexit '+m.exit)});
</script>
