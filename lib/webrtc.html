<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,interactive-widget=resizes-content"><title>a webrtc</title>
<style>body{margin:0;background:#000;color:#fff;font:16px monospace;display:flex;flex-flow:column;height:100dvh}#log{flex:1;display:flex;flex-flow:column-reverse;overflow:auto;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}iframe{flex:3;min-height:0;width:100%;border:0}#bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}input,button,select{font:inherit;background:#111;color:inherit;border:1px solid #777;padding:10px;min-width:0}details{width:100%}button:disabled{opacity:.4}a{color:#8cf}video{width:48%;max-height:35vh}</style>
<div><video id=far autoplay playsinline controls hidden></video><video id=near autoplay playsinline muted hidden></video></div><iframe id=term src="/op?rtc" title=Shell hidden></iframe><div id=log></div>
<div id=bar><details id=pair open><summary>Pair devices</summary><p>Scan or enter code within 90s. Disconnect cancels.</p><img id=qr width=232 height=232 alt=QR hidden><br><button id=offer>Create code</button><input id=peer placeholder=Code aria-label=Code maxlength=6 autocapitalize=characters><button id=scan>Scan QR</button><button id=use>Connect</button><button id=copy disabled>Copy</button><button id=quit>Disconnect</button></details><select id=mode aria-label=Mode><option value=msg>Messages</option><option value=cmd>Commands</option><option value=shell>Shell</option></select><button id=grant hidden>Share shell (10 min)</button><input id=cmd placeholder="Message or command"><button id=send disabled>Send</button><button id=run hidden disabled>Approve command</button><button id=deny hidden disabled>Reject command</button><button id=audio disabled>Microphone</button><button id=video disabled>Camera</button><input id=file type=file disabled aria-label="Send file"><select id=cred aria-label="Credential"><option value=github>GitHub · notes</option><option value=gdrive>Google Drive · books</option><option value=vault>Encrypted vault</option></select><button id=adopt disabled>Send credential</button><span id=ms></span></div>
<script>
const media=['audio','video'];
const L=m=>log.append('\n'+m),V=s=>btoa(unescape(encodeURIComponent(s)));
let p,d,C,A,W,sid='',ok=false,q=null,sent=0,seq=0;const frame=new Promise(r=>term.onload=()=>r(frames[0]));
const help=(e,b)=>L(e+'\n'+(media.includes(b?.id)||b==scan?'Use HTTPS/localhost; allow camera/mic. For QR use Android Chrome or enter the code.':'Check internet, Nearby permission and a serve. Retry a new code or the same Wi-Fi (no relay).'));
const on=(b,f,e='onpointerdown')=>b[e]=async()=>{const t=performance.now();try{const r=f();if(r)await r}catch(e){if(e.name!='AbortError'){if(b==offer||b==use||b==scan)close();help(e,b)}}ms.textContent=(performance.now()-t).toFixed(3)+' ms'};
const tx=(m,c=d)=>c?.readyState=='open'&&c.send(JSON.stringify(m)),lock=v=>run.disabled=deny.disabled=v,ui=()=>{const m=mode.value;grant.disabled=audio.disabled=video.disabled=file.disabled=adopt.disabled=!ok;send.disabled=!ok||m=='cmd'&&sent;grant.hidden=!(cmd.hidden=send.hidden=m=='shell');run.hidden=deny.hidden=m!='cmd'};
function rtc(s){if(sid)W?W.readyState==1&&W.send(s):tx({shell:sid,input:s})}
function end(){if(!sid)return;const id=sid;sid='';W?.close();W=null;term.hidden=true;grant.textContent='Share shell (10 min)';tx({shell:id,end:1});L('Shell ended')}
function show(id,until){until=new Date(until).toLocaleTimeString();sid=id;mode.value='shell';term.hidden=false;grant.textContent='End shell by '+until;ui();frame.then(w=>{w.reset();w.fit()});L((W?'Sharing':'Remote')+' shell until '+until)}
function unscan(){seq++;near.srcObject?.getTracks().forEach(t=>t.stop());near.srcObject=null;near.hidden=true;scan.disabled=false}
function close(){unscan();qr.hidden=true;A?.abort();p?.getSenders().forEach(s=>s.track?.stop());far.srcObject=null;far.hidden=true;p?.close();p=d=null;end();mode.value='msg';ok=false;q=null;sent=0;lock(true);ui();copy.disabled=true;pair.open=true;offer.disabled=use.disabled=scan.disabled=false;L('Disconnected')}
function start(c=crypto.randomUUID().slice(0,6).toUpperCase()){unscan();qr.hidden=true;C=c;offer.disabled=use.disabled=scan.disabled=true;L('Pairing…');A=new AbortController;p=new RTCPeerConnection({bundlePolicy:'max-bundle',iceServers:[{urls:'stun:stun.cloudflare.com'}]});p.ontrack=e=>{(far.srcObject??=new MediaStream).addTrack(e.track);e.track.onunmute=()=>far.hidden=false};p.ondatachannel=e=>e.channel.label=='a'?wire(e.channel):receive(e.channel);p.onconnectionstatechange=e=>{const s='Connection: '+e.target.connectionState;if(/failed|disconnected/.test(s)){close();help(s)}else L(s)}}
async function local(){if(!p.remoteDescription)for(const k of media)p.addTransceiver(k).setCodecPreferences(RTCRtpSender.getCapabilities(k).codecs.filter(c=>/opus|VP8/.test(c.mimeType)));else p.getTransceivers().forEach(t=>t.direction='sendrecv');await p.setLocalDescription();await new Promise(r=>p.onicecandidate=({candidate:c})=>{if(!c||c.type=='srflx'&&!c.address.includes(':'))r()});return p.localDescription}
qr.onerror=()=>{qr.hidden=true;L('Enter code, or install qrencode (Termux: pkg install libqrencode) for QR.')}
async function signal(op,s){const r=await fetch('https://demo.seanpatten.com/rtcpair',{method:'POST',signal:A.signal,body:C+'\n'+op+'\n'+(s?JSON.stringify(s):'')});if(!r.ok)throw Error(await r.text());if(!op){peer.value=C;copy.disabled=false;L('Pairing code: '+C);qr.src='/qr?'+C;qr.hidden=false}if(op!=2)return r.json()}
function wire(c){d=c;d.onopen=()=>tx({code:C});d.onclose=()=>d==c&&(close(),help('Peer disconnected'));
 d.onmessage=e=>{const m=JSON.parse(e.data),id=m.shell;if(!ok){if(m.code!==C){L('CODE MISMATCH');close();return}ok=true;ui();pair.open=false;L('Connected: '+C);return}
 if(id){if(m.until&&sid&&id!=sid)tx({shell:id,end:1});else if(m.end&&id==sid)end();else if(m.until&&!sid)show(id,m.until);else if(id==sid){if(typeof m.input=='string'&&m.input.length<1024&&W?.readyState==1)W.send(m.input);else if(typeof m.term=='string'&&!W)frame.then(w=>w.feed(m.term))}return}
 if(typeof m.msg=='string')return L('Peer: '+m.msg);
 if(typeof m.cmd=='string'){if(mode.value!='cmd'||q!==null){tx({out:'Commands unavailable: message mode or busy',exit:1});L('Refused: '+m.cmd);return}q=m.cmd;L('Peer command:\n'+q);lock(false)}else if(typeof m.out=='string'){L('Peer result: '+m.out+'\nexit '+m.exit+'; '+(performance.now()-sent).toFixed(3)+' ms including approval');sent=0;ui()}}}
on(offer,async()=>{start();wire(p.createDataChannel('a'));await p.setRemoteDescription(await signal(0,await local()))});
function code(c){c=c.trim().toUpperCase();if(!/^[0-9A-F]{6}$/.test(c))throw Error('Code must be six hex digits');return c}
on(use,async()=>{start(code(peer.value));await p.setRemoteDescription(await signal(1));await signal(2,await local())});
on(copy,()=>navigator.clipboard.writeText(C));on(quit,close);
on(scan,async()=>{
 const id=++seq;scan.disabled=true;
 const reader=new BarcodeDetector({formats:['qr_code']}),s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
 if(id!=seq){s.getTracks().forEach(t=>t.stop());return}near.srcObject=s;near.hidden=false;
 while(id==seq){await new Promise(r=>near.requestVideoFrameCallback(r));const [b]=await reader.detect(near);if(b&&id==seq){unscan();peer.value=code(b.rawValue);L('QR read: '+peer.value+'; press Connect')}}
});
for(const k of media)on(window[k],async()=>{const pc=p,s=p.getTransceivers().find(t=>t.receiver.track.kind==k).sender,t=s.track?null:(await navigator.mediaDevices.getUserMedia({[k]:true})).getTracks()[0];s.track?.stop();if(p!=pc){t?.stop();return}await s.replaceTrack(t).catch(e=>{t?.stop();throw e});if(k=='video'){near.hidden=!t;near.srcObject=t?new MediaStream([t]):null}L(k+(t?' on':' off'))});
on(send,()=>{const v=cmd.value,m=mode.value;if(send.disabled||!v.trim())return;tx({[m]:v});L((m=='cmd'?'Command: ':'You: ')+v);if(m=='cmd')sent=performance.now(),ui();cmd.value=''});
on(mode,()=>{end();if(!run.disabled)deny.onpointerdown();ui();if(mode.value=='shell')L('Share shell on the device to control')},'onchange');
on(grant,()=>{if(sid)return end();if(!ok||!confirm('Give the peer shell control for 10 minutes without per-command approval?'))return;const id=crypto.randomUUID(),until=Date.now()+6e5,w=new WebSocket('ws://'+location.host+'/shell?600'),utf8=new TextDecoder;W=w;show(id,until);w.binaryType='arraybuffer';w.onopen=()=>tx({shell:id,until});w.onmessage=e=>{const s=utf8.decode(e.data,{stream:true});frame.then(t=>t.feed(s));tx({shell:id,term:s})};w.onerror=()=>help('Shell failed',grant);w.onclose=()=>W==w&&end()});
on(deny,()=>{q=null;lock(true);tx({out:'Rejected by receiver',exit:1});L('Rejected')});
on(run,async()=>{if(!ok||q===null)return;const c=d;lock(true);const r=await fetch('/api/omni',{method:'POST',body:new URLSearchParams({q:'webrtc run '+V(q)})});const t=await r.text(),m=JSON.parse(t.slice(t.indexOf('>')+1,t.lastIndexOf('</pre>')));q=null;tx(m,c);L(m.out+'\nexit '+m.exit)});
function receive(c){let b=[],n=0,done=false;const row=document.createElement('p');log.append(row);c.onclose=()=>{if(!done){b=[];row.textContent='File interrupted; reconnect and send it again'}};c.onmessage=e=>{if(typeof e.data=='string'){done=true;const k=/^adopt-(github|gdrive|vault)\.json$/.exec(e.data)?.[1],f=new Blob(b),a=document.createElement(k?'button':'a');if(k){a.textContent='Install '+k;on(a,async()=>{const r=await fetch('/adopt/'+k,{method:'POST',body:f}),s=await r.text();if(!r.ok||!s.startsWith('Saved '))throw Error(s);a.textContent=s;a.disabled=true;a.onpointerdown=null})}else{a.href=URL.createObjectURL(f);a.download=e.data;a.textContent='Download '+e.data;if(window.A?.save)a.onclick=e=>{e.preventDefault();const r=new FileReader;r.onload=()=>window.A.save(a.download,r.result.split(',')[1]);r.readAsDataURL(f)}}b=[];row.replaceChildren(a);c.close()}else{b.push(e.data);row.textContent=(n+=e.data.byteLength)+' bytes received'}}}
function sendfile(f){L('Sending: '+f.name);const c=p.createDataChannel('file');c.bufferedAmountLowThreshold=65536;on(c,async()=>{for(let i=0;i<f.size;i+=16384){if(c.bufferedAmount>65536)await new Promise(r=>c.onbufferedamountlow=r);c.send(await f.slice(i,i+16384).arrayBuffer())}c.send(f.name);L('Sent: '+f.name)},'onopen')}
on(file,()=>{const f=file.files[0];if(f)sendfile(f);file.value=''},'onchange');
on(adopt,async()=>{const k=cred.value,r=await fetch('/adopt/'+k),f=await r.blob();if(!r.ok||f.size<4)throw Error('No '+k+' files');sendfile(new File([f],'adopt-'+k+'.json'))});
</script>
