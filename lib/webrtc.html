<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>a webrtc</title>
<style>body{margin:0;background:#000;color:#fff;font:16px monospace;display:flex;flex-direction:column;height:100dvh}#log{flex:1;overflow:auto;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}iframe{flex:3;min-height:0;width:100%;border:0}#bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}input,button,select{font:inherit;background:#111;color:inherit;border:1px solid #777;padding:10px;min-width:0}details{width:100%}button:disabled{opacity:.4}</style>
<iframe id=term src="/op?rtc" title="Shell" hidden></iframe><div id=log></div>
<div id=bar><details id=pair open><summary>Pair devices</summary><ol><li>Open localhost:1111 on both devices and choose WebRTC.</li><li>Press Create pairing code on either device.</li><li>Enter it on the other device and press Connect within 90 seconds.</li></ol><button id=offer>Create pairing code</button><input id=peer placeholder="Pairing code" aria-label="Pairing code" maxlength=6 autocapitalize=characters><button id=use>Connect</button><button id=copy disabled>Copy</button><button id=stop>Disconnect</button></details><select id=mode aria-label="Mode"><option value=msg>Messages only</option><option value=cmd>Commands</option><option value=shell>Shell</option></select><button id=grant hidden>Share this shell (10 min)</button><input id=cmd placeholder="Type here" aria-label="Message or command"><button id=send disabled>Send</button><button id=run hidden disabled>Approve command</button><button id=deny hidden disabled>Reject command</button><span id=ms></span></div>
<script>
const L=m=>{log.textContent+='\n'+m;log.scrollTop=log.scrollHeight},V=s=>btoa(unescape(encodeURIComponent(s)));
let p,d,C,A,W,sid='',verified=false,pending=null,sent=0;const terminal=new Promise(r=>term.onload=()=>r(term.contentWindow));
const action=(b,f,e='onpointerdown')=>b[e]=async()=>{const t=performance.now();try{await f()}catch(e){if(e.name!='AbortError'){L(e);if(b==offer||b==use)close()}}ms.textContent=(performance.now()-t).toFixed(3)+' ms'};
const tx=m=>{if(d?.readyState=='open')d.send(JSON.stringify(m))},ready=()=>{send.disabled=!verified||(mode.value=='cmd'&&sent>0);grant.disabled=!verified;grant.hidden=!(cmd.hidden=send.hidden=mode.value=='shell');run.hidden=deny.hidden=mode.value!='cmd'};
function reset(){end();mode.value='msg';verified=false;pending=null;sent=0;run.disabled=deny.disabled=true;ready()}
function rtc(s){if(sid)W?W.readyState==1&&W.send(s):tx({shell:sid,input:s})}
function end(){if(!sid)return;const id=sid;sid='';W?.close();W=null;term.hidden=true;grant.textContent='Share this shell (10 min)';tx({shell:id,end:1});L('Shell ended')}
function show(id,until){until=new Date(until).toLocaleTimeString();sid=id;mode.value='shell';term.hidden=false;grant.textContent='End shell by '+until;ready();terminal.then(w=>{w.reset();w.fit()});L((W?'Sharing this':'Remote')+' shell until '+until)}
function close(){A?.abort();p?.close();p=d=null;reset();copy.disabled=true;pair.open=true;offer.disabled=use.disabled=false;L('Disconnected')}
function start(c=crypto.randomUUID().slice(0,6).toUpperCase()){if(p)throw Error('Disconnect first');C=c;offer.disabled=use.disabled=true;L('Pairing…');A=new AbortController;p=new RTCPeerConnection({iceServers:[{urls:'stun:stun.cloudflare.com'}]});p.ondatachannel=e=>wire(e.channel);p.onconnectionstatechange=e=>{const s=e.target.connectionState;L('Connection: '+s);if(s=='failed'||s=='disconnected')close()}}
async function local(){await p.setLocalDescription();await new Promise(r=>p.onicecandidate=e=>{if(!e.candidate||e.candidate.type=='srflx'&&!e.candidate.address.includes(':'))r()});return p.localDescription}
async function exchange(op,s){const r=await fetch('https://demo.seanpatten.com/rtcpair',{method:'POST',signal:A.signal,body:C+'\n'+op+'\n'+(s?JSON.stringify(s):'')});if(!r.ok)throw Error(await r.text());if(!op){peer.value=C;copy.disabled=false;L('Pairing code: '+C+' (90 seconds)')}if(op!=2)return r.json().catch(()=>{throw Error('Create a new pairing code')})}
function wire(channel){d=channel;d.onopen=()=>tx({code:C});d.onclose=()=>{reset();L('Channel closed')};
 d.onmessage=e=>{const m=JSON.parse(e.data);if(!verified){if(m.code!==C){L('CODE MISMATCH');close();return}verified=true;ready();pair.open=false;L('Connected: '+C);return}
 if(m.shell){if(m.until&&sid&&m.shell!=sid)tx({shell:m.shell,end:1});else if(m.end&&m.shell==sid)end();else if(m.until&&!sid)show(m.shell,m.until);else if(m.shell==sid){if(typeof m.input=='string'&&m.input.length<1024&&W?.readyState==1)W.send(m.input);else if(typeof m.term=='string'&&!W)terminal.then(w=>w.feed(m.term))}return}
 if(typeof m.msg=='string'){L('Peer: '+m.msg);return}
 if(typeof m.cmd=='string'){if(mode.value!='cmd'||pending!==null){tx({out:'Commands unavailable: message mode or busy',exit:1});L('Refused: '+m.cmd);return}pending=m.cmd;L('Peer command:\n'+pending);run.disabled=deny.disabled=false}else if(typeof m.out=='string'){L('Peer result: '+m.out+'\nexit '+m.exit+'; '+(performance.now()-sent).toFixed(3)+' ms including approval');sent=0;ready()}}}
action(offer,async()=>{start();wire(p.createDataChannel('a'));await p.setRemoteDescription(await exchange(0,await local()))});
action(use,async()=>{const c=peer.value.trim().toUpperCase();if(!/^[0-9A-F]{6}$/.test(c))throw Error('Enter the other device’s pairing code');start(c);await p.setRemoteDescription(await exchange(1));await exchange(2,await local())});
action(copy,()=>navigator.clipboard.writeText(C));action(stop,close);
action(send,()=>{if(send.disabled||!cmd.value.trim())return;tx({[mode.value]:cmd.value});L('You'+(mode.value=='cmd'?' (command)':'')+': '+cmd.value);if(mode.value=='cmd')sent=performance.now();cmd.value='';ready()});
action(mode,()=>{end();if(!run.disabled)deny.onpointerdown();ready();L('Mode: '+mode.selectedOptions[0].text+(mode.value=='shell'?'. On the device to control, press Share this shell.':''))},'onchange');
action(grant,()=>{if(sid){end();return}if(!verified||!confirm('Allow the paired device to control this shell for 10 minutes without approving each command?'))return;const id=crypto.randomUUID(),until=Date.now()+600000,w=new WebSocket('ws://'+location.host+'/shell?600'),decoder=new TextDecoder;W=w;show(id,until);w.binaryType='arraybuffer';w.onopen=()=>tx({shell:id,until});w.onmessage=e=>{const s=decoder.decode(e.data,{stream:true});terminal.then(t=>t.feed(s));tx({shell:id,term:s})};w.onclose=()=>{if(W==w)end()}});
action(deny,()=>{pending=null;run.disabled=deny.disabled=true;tx({out:'Rejected by receiver',exit:1});L('Rejected')});
action(run,async()=>{if(!verified||pending===null)return;const channel=d;run.disabled=deny.disabled=true;const r=await fetch('/api/omni',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'q='+encodeURIComponent('webrtc run '+V(pending))});const t=await r.text(),m=JSON.parse(t.slice(t.indexOf('>')+1,t.lastIndexOf('</pre>')));pending=null;if(channel.readyState=='open')channel.send(JSON.stringify(m));L(m.out+'\nexit '+m.exit)});
</script>
