q.oninput=_=>{for(var d of l.children)d.hidden=!d.textContent.toLowerCase().includes(q.value.toLowerCase());clearTimeout(q.k);q.k=setTimeout(S,200,q.value)};p.onplaying=_=>{if(cur)cur.className='on'};p.onerror=_=>{if(cur)cur.className='x'};S('')
