<!doctype html><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>a fleet</title>
<!-- Unified fleet tmux view: every device's tmux windows in one list (from /fwins), one inline terminal (/op) that
     re-points on click/j-k — like one giant tmux session across all reachable devices. Pieces reused: term.html(/op),
     ssh window attach (w=ssh:dev:idx), fleet.txt reachability. Enumerator: lib/fwins.sh. -->
<style>
html,body{margin:0;height:100%}
body{background:#000;color:#eee;font:14px system-ui;display:flex;flex-direction:column;overflow:hidden}
#top{padding:6px 10px;border-bottom:1px solid #222;display:flex;gap:14px;align-items:center;font-size:13px;color:#888}
#top b{color:#fff;font-weight:600}#ms{color:#6c6;font-variant-numeric:tabular-nums}
#main{flex:1;display:flex;min-height:0}
#s{width:214px;overflow-y:auto;border-right:1px solid #222;background:#0a0a0a}
#t{flex:1;border:0;background:#000}
.g{color:#6cf;padding:9px 10px 3px;font-size:12px;position:sticky;top:0;background:#0a0a0a}
.w{display:block;color:#ccc;text-decoration:none;padding:5px 10px;font-size:13px;cursor:pointer;border-left:2px solid #0000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w:hover{background:#161616}.w.sel{background:#fff;color:#000;border-left-color:#6cf}
@media(max-width:640px){#main{flex-direction:column}#s{width:auto;height:36vh;border-right:0;border-bottom:1px solid #222}}
</style>
<div id=top><b>a fleet</b><span id=ms>scanning fleet…</span><span style=color:#555>click / j k move · ↵ open · switches like one tmux</span></div>
<div id=main><div id=s>…</div><iframe id=t name=t></iframe></div>
<script>
var S=document.getElementById('s'),T=document.getElementById('t'),MS=document.getElementById('ms');
var cur=localStorage.fwsel||'',sel=cur,rows=[],ci=0;   /* cur = what the iframe is ATTACHED to · sel = what's VISIBLE (tmux may switch under us) */
function open_(tg){if(tg&&tg!==cur){cur=tg;T.src='/op?w='+encodeURIComponent(tg)+'&all';}setsel(tg);}
function setsel(tg){if(!tg)return;sel=tg;localStorage.fwsel=tg;hl();}
function hl(){rows.forEach(function(r,i){var s=r.dataset.t===sel;r.classList.toggle('sel',s);if(s)ci=i;});}
/* window switched from INSIDE the terminal (C-j/C-k, M-←/→, C-PgUp/PgDn): follow it, never re-attach.
   the attached tmux paints its window list in the last status row; the active entry is the highlighted
   "3:name" cell — same marker `a fl` greps server-side (48;2;255;255;255). Works local + remote, no config. */
function sync(){try{var d=T.contentDocument;if(!d)return;var rs=d.querySelectorAll('#scr>div');
  for(var i=rs.length-1;i>=0&&i>=rs.length-2;i--){var sp=rs[i].children;
    for(var j=0;j<sp.length;j++){var bg=sp[j].style.background,m=sp[j].textContent.match(/^\s*(\d+):/);
      if(m&&bg&&bg!=='rgb(0, 0, 0)'){var p=cur.match(/^(ssh:[^:]+:)/),tg=(p?p[1]:'')+m[1];
        if(tg!==sel)setsel(tg);return;}}}}catch(e){}}
setInterval(sync,600);
var last=null;
function render(txt){if(txt===last&&rows.length)return;last=txt;   /* identical list = leave the DOM alone (rebuilding it every 4s made rows flicker under the cursor) */
  var t0=performance.now(),g='',dev='',n=0;
  txt.split('\n').forEach(function(l){if(!l)return;var p=l.split('\t');if(p.length<3)return;n++;
    if(p[0]!==dev){dev=p[0];g+='<div class=g>'+esc(dev)+'</div>';}
    g+='<a class=w data-t="'+esc(p[1])+'">'+esc(p[2]||p[1])+'</a>';});
  S.innerHTML=g||'<div class=g>no windows — reachable?</div>';
  rows=[].slice.call(S.querySelectorAll('.w'));
  rows.forEach(function(r){r.onclick=function(){open_(r.dataset.t);};});
  if(rows.length&&!rows.some(function(r){return r.dataset.t===sel;}))open_(rows[0].dataset.t);else hl();
  MS.textContent=n+' win · '+(performance.now()-t0).toFixed(3)+'ms';}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function poll(){fetch('/fwins').then(function(r){return r.text();}).then(render).catch(function(){});}
poll();setInterval(poll,4000);
document.addEventListener('keydown',function(e){if(!rows.length)return;var k=e.key;
  if(k==='j'||k==='ArrowDown'){ci=Math.min(ci+1,rows.length-1);}
  else if(k==='k'||k==='ArrowUp'){ci=Math.max(ci-1,0);}
  else if(k==='Enter'){open_(rows[ci].dataset.t);return;}
  else return;e.preventDefault();rows.forEach(function(r,i){r.classList.toggle('sel',i===ci);});rows[ci].scrollIntoView({block:'nearest'});});
</script>
