<script>(()=>{let o=0;const c=document.getElementById('pf'),p=document.getElementById('pfp');
c.onclick=()=>{o=!o;p.style.display=o?'block':'none';if(o)fetch('/api/omni',{method:'POST',body:'q=profile htmlbody'}).then(r=>r.text()).then(t=>{const i=t.indexOf('<!doctype'),j=t.lastIndexOf('</pre>');p.srcdoc=i<0?t:t.slice(i,j>i?j:t.length)})}})()</script>
<div id=v_index class=v style="align-items:center">
  <form id=omni autocomplete=off style="margin-top:9vh"><textarea id=qi rows=1 autofocus autocomplete=off autocapitalize=off autocorrect=off spellcheck=false placeholder="" style="width:80vw;max-width:600px;font-size:24px;padding:16px;text-align:center;background:#000;color:#fff;border:1px solid #333;border-radius:8px;outline:none;caret-color:#4af;resize:none;overflow-y:auto;max-height:50vh;box-sizing:border-box"></textarea></form>
  <div style="display:flex;gap:12px;align-items:center;margin-top:10px"><span id=agb data-go="/ag" style="font-size:14px;padding:6px 14px;color:#4af;background:#000;border:1px solid #333;border-radius:8px;cursor:pointer;touch-action:manipulation">claude</span><select id=dev class=f style="font-size:14px;padding:6px">__DO__</select><span id=qh style="color:#345;font-size:15px">tap a page · or type a command / prompt</span></div>

  <div id=tl style="width:95vw;max-width:900px;color:#fff;font-family:monospace;font-size:14px;margin-top:10px">__TO__</div>

  <select id=jp class=f style="width:95vw;font-size:20px;padding:12px">__PO__</select>

  <div style="display:flex;gap:10px;width:95vw;align-items:center">
    <input id=jc placeholder="prompt" onkeydown="if(event.key==='Enter')runjob()" class=f style="flex:1;font-size:24px;padding:16px">

<div id=v_note class=v style="padding-top:20px;align-items:center">
  <form id=nf style="display:flex;flex-direction:column;gap:10px;width:95vw">
    <textarea id=nc autofocus rows=1 placeholder="note — type, enter to save (shift-enter newline)" class=f style="width:100%;font-size:32px;padding:22px;box-sizing:border-box;resize:none;overflow:hidden" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();nf.requestSubmit()}"></textarea>
    <div style="display:flex;gap:10px">
      <button class=b type=submit style="flex:1">save</button>
      <button class=b type=button onclick="var n=0;ns.textContent='⟳ syncing…';fetch('/api/sync',{method:'POST'});var p=setInterval(()=>fetch('/api/sync-status').then(r=>r.text()).then(t=>{if(t=='syncing')ns.textContent='⟳ syncing… '+(++n)+'s';else{clearInterval(p);ns.textContent='✓ synced '+t;fetch('/note-list').then(r=>r.text()).then(h=>nl.innerHTML=h)}}),1000)">sync</button>
      <button class=b type=button data-go="/term">term</button>
    </div>
  </form>
  <div id=ns style="width:95vw;min-height:24px;margin-top:8px;font-size:18px;word-break:break-all"></div>

</div>
<script>
var views={'/':'v_index','/jobs':'v_jobs','/term':'v_term','/note':'v_note','/tasks':'v_tasks','/ag':'v_ag'__MV__};
// 1ms mandate: action times shown LIVE (pms corner) — keep. go() must stay <1ms; show() is DOM toggle only, no network.
function _pm(t,l){pms.textContent=l+' '+(performance.now()-t).toFixed(3)+'ms'}
function go(p){var t=performance.now();history.pushState(null,'',p);show(p);_pm(t,'nav '+p);}
function show(p){for(var k in views)window[views[k]].classList.toggle('on',k===p);if(p==='/term'){if(!tif.src)tif.src='/op';setTimeout(function(){try{tif.contentWindow.focus()}catch(e){}},50);}if(p==='/note'){setTimeout(function(){nc.focus()},0);fetch('/note-list').then(r=>r.text()).then(h=>nl.innerHTML=h);}if(p==='/')qi.oninput()}
function arcn(f,el){fetch('/api/note/archive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({f:f})});el.parentElement.remove();}
function arct(d,el){fetch('/api/task/archive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({d:d})});el.parentElement.remove();}
function loadjobs(){Promise.all([fetch('/api/jobs').then(function(r){return r.text()}),fetch('/api/job-status').then(function(r){return r.json()})]).then(function(d){
  var h=d[0];if(d[1].length){h+='\\n\\n--- Job PRs ---\\n';d[1].forEach(function(j){
    h+=j.status+(j.step?' ['+j.step+']':'')+' '+j.name;
    if(j.session)h+=' ('+j.session+')';h+='\\n';});}
  jl.textContent=h;});}
function runjob(){var v=jc.value.trim(),p=jp.value,n=parseInt(jn.value),d=jd.value,pr=jpr.checked;if(!v)return;fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:v,project:p,count:n,device:d,pr:pr})}).then(function(r){return r.json()}).then(function(r){jc.value='';jc.placeholder=r.command||r.error;loadjobs();});}
window.onpopstate=function(){show(location.pathname);};
tf.onsubmit=function(e){e.preventDefault();var t=tc.value.trim();if(!t)return;var p=tp.value.trim(),q='task add -u '+(/^\d{1,5}$/.test(p)?p.padStart(5,'0')+' ':'')+t;
  tst.style.color='#fa0';tst.textContent='saving…';
  fetch('/api/omni',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'q='+encodeURIComponent(q)}).then(function(r){return r.text()}).then(function(h){
    var u=(h.match(/https?:\/\/[^\s<]+/)||[''])[0];tst.style.color='#6a6';
    tst.innerHTML=u?'✓ saved → <a href="'+u+'" target=_blank style="color:#6cf">'+u+'</a>':'✓ '+(h.replace(/<[^>]*>/g,'').trim()||'saved');
    tc.value='';tp.value='';fetch('/api/tasks').then(function(r){return r.text()}).then(function(x){tl.innerHTML=x})});};
function st(s){fetch('/api/tasks?sort='+s).then(function(r){return r.text()}).then(function(x){tl.innerHTML=x})}
nf.onsubmit=function(e){e.preventDefault();var c=nc.value.trim();if(!c)return;nc.value='';nc.style.height='auto';ns.innerHTML='<span style="color:#fa0">⟳ syncing… </span>'+c;fetch('/note',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'c='+encodeURIComponent(c)}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){var m=t.match(/https?:\/\/\S+/);if(m)ns.innerHTML='<span style="color:#4a4">saved → </span><a href="'+m[0]+'" target=_blank style="color:#4af">'+m[0]+'</a>';else ns.textContent=t.split('\n').filter(function(l){return l.trim().indexOf('saved')===0})[0]||'saved ✓';fetch('/note-list').then(function(r){return r.text()}).then(function(h){nl.innerHTML=h})}).catch(function(){ns.innerHTML='<span style="color:#f44">save FAILED</span>'});};
// press-to-act: fire on pointerdown (mouse+touch), not lift-off — matches native depress-instant. inputs/selects keep focus; modifier-clicks pass through.
var _act='[data-go],.pg,button,a[href],[onclick]',_in='input,select,textarea';
addEventListener('pointerdown',function(e){if(e.button||e.metaKey||e.ctrlKey||e.shiftKey)return;
  var t=e.target.closest(_act);if(!t||e.target.closest(_in))return;
  e.preventDefault();var g=t.closest('[data-go]');g?go(g.dataset.go):t.click();},true);
addEventListener('click',function(e){if(!e.isTrusted)return;if(e.target.closest(_act)&&!e.target.closest(_in)){e.stopImmediatePropagation();e.preventDefault();}},true);
qi.onblur=function(){setTimeout(function(){if(document.activeElement===document.body)qi.focus()},0)};
window.onfocus=function(){qi.style.borderColor='#555'};window.onblur=function(){qi.style.borderColor='#333'};
var _cmds=__CMDS__,_cs=0;
_cmds.sort(function(a,b){function h(c){return c[1]==='page'||views['/'+c[0]]?1:0}return h(b)-h(a)});
// web interfaces = the primary launchables: prepopulated (freq-sorted) by default, favored on type
var PAGES=[['/bm','a bm'],['/feed','a feed'],['/p','a proj'],['/op','a op'],['/dash','a dash'],['/stream','a stream'],['/cam','a cam'],['/dev','a devices'],['/jobs','a jobs'],['/note','a note'],['/tasks','a tasks'],['/flow','a flow'],['/term','a term'],['/book','a book'],['/book?sort=author','authors'],['/docs','a docs'],['/cloud','a cloud'],['/prompt','a prompt']];
/* agent/type picker: own PAGE (v_ag), not a dropdown — go('/ag') is a DOM toggle, <1ms like all nav */
var AGO=[['c','claude'],['co','codex'],['g','gemini'],['grok','grok'],['note','note'],['task','task']],AG=0;
try{for(var _ai=0;_ai<AGO.length;_ai++)if(AGO[_ai][0]===localStorage.agm)AG=_ai}catch(e){}
function agv(){return AGO[AG][0]}
v_ag.innerHTML='<div style="color:#456;font-size:16px">enter sends to</div>'+AGO.map(function(a,i){return '<div class=n id=ago'+i+' onclick="agset('+i+')" style="min-width:200px;text-align:center">'+a[1]+'</div>'}).join('')+'<div style="color:#345;font-size:13px">1–'+AGO.length+' select · ↑↓ move · esc back</div>';
function agsel(i){AG=(i+AGO.length)%AGO.length;try{localStorage.agm=agv()}catch(e){}agb.textContent=AGO[AG][1];for(var j=0;j<AGO.length;j++){var s=j===AG,el=window['ago'+j];el.style.background=s?'#fff':'#000';el.style.color=s?'#000':'#4af'}}
function agset(i){agsel(i);go('/');qi.focus()}
agsel(AG);
function gsearch(){var q=qi.value.trim();if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')}
function sav(k,t){qi.value='';qi.style.height='auto';qo.innerHTML='<div style="padding:10px 16px;color:#fa0;font-size:17px">⟳ '+k+'… '+t.slice(0,120).replace(/</g,'&lt;')+'</div>';
  fetch(k=='note'?'/note':'/api/omni',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:k=='note'?'c='+encodeURIComponent(t):'q='+encodeURIComponent('task add '+t)}).then(function(r){return r.text()}).then(function(x){var m=x.match(/https?:\/\/[^\s<]+/);qo.innerHTML='<div style="padding:10px 16px;color:#4a4;font-size:17px">✓ '+k+' saved'+(m?' → <a href="'+m[0]+'" target=_blank style=color:#4af>'+m[0]+'</a>':'')+'</div>';qi.focus()}).catch(function(){qo.innerHTML='<div style="padding:10px 16px;color:#f44;font-size:16px">✗ '+k+' failed</div>'})}
function pfreq(r){try{return +(localStorage['pf'+r]||0)}catch(e){return 0}}
function navpage(r){try{localStorage['pf'+r]=pfreq(r)+1}catch(e){}if(views[r])go(r);else location.href=r}
function _sg(){return qo.querySelectorAll('[data-p],[data-c],[data-a],[data-g],[data-n]')}
function hl(){var it=_sg();it.forEach(function(el,i){var s=i===_cs;el.style.background=s?'#fff':'';el.style.color=s?'#000':el.dataset.c?'#555':el.dataset.a?'#4af':el.dataset.g?'#7a7':el.dataset.n?'#a94':''})}
qi.oninput=function(){var _t=performance.now(),v=qi.value.toLowerCase();_cs=0;qi.style.height='auto';qi.style.height=qi.scrollHeight+'px';
  var pg=PAGES.slice().sort(function(a,b){return pfreq(b[0])-pfreq(a[0])});
  if(v)pg=pg.filter(function(p){return p[1].indexOf(v)>=0||p[0].slice(1).indexOf(v)>=0});
  var ph=pg.length?'<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:16px">'+pg.map(function(p){return '<div class=pg data-p="'+p[0]+'" onclick="navpage(this.dataset.p)">'+p[1]+'</div>'}).join('')+'</div>':'';
  var ch='';if(v)ch=_cmds.filter(function(c){return c[0].indexOf(v)>=0}).slice(0,10).map(function(c,i){var w=c[0].slice(0,8)==='web http';return '<div data-c="'+c[0]+'" style="padding:8px 16px;color:'+(i?'#555':'#4af')+';cursor:pointer;font-size:18px" onclick="'+(w?"window.open(this.dataset.c.slice(4),'_blank')":"qi.value=this.dataset.c;omni.requestSubmit()")+'">'+(w?'↗ '+c[0].slice(4):'a '+c[0])+(c[1]?' <span style=color:#333>'+c[1]+'</span>':'')+'</div>'}).join('');
  var raw=qi.value.trim(),ci='',pv=(raw.length>120?raw.slice(0,120)+'…':raw).replace(/</g,'&lt;');
  if(raw&&!/^\d+$/.test(v))
    ci='<div data-a=1 onclick="omni.requestSubmit()" style="padding:10px 16px;color:#4af;cursor:pointer;font-size:18px">↵ → '+(dev.value?dev.value+' · ':'')+AGO[AG][1]+': '+pv+'</div>';
  var gs=raw?'<div data-g=1 style="padding:8px 16px;color:#7a7;cursor:pointer;font-size:16px" onclick="gsearch()">&#x1F50D; google: '+pv+'</div>':'';
  var nt=raw?['note','task'].map(function(k){return '<div data-n='+k+' onclick="sav(this.dataset.n,qi.value.trim())" style="padding:8px 16px;color:#a94;cursor:pointer;font-size:16px">+ '+k+': '+pv+'</div>'}).join(''):'';
  qo.innerHTML=ph+ch+ci+gs+nt;hl();_pm(_t,'search')};dev.onchange=qi.oninput;show(views[location.pathname]?location.pathname:'/');
document.addEventListener('keydown',function(e){if(!v_ag.classList.contains('on'))return;var k=e.key;if(k>='1'&&k<='9'&&+k<=AGO.length){e.preventDefault();agset(+k-1)}else if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();agsel(AG+(k==='ArrowDown'?1:-1))}else if(k==='Enter'||k==='Escape'){e.preventDefault();go('/');qi.focus()}});
qi.onkeydown=function(e){if(v_ag.classList.contains('on'))return;if(e.ctrlKey&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();agsel(AG+(e.key==='ArrowUp'?-1:1));qi.oninput();return}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();omni.requestSubmit();return}var it=_sg();if(!it.length)return;if(e.key==='ArrowDown'){e.preventDefault();_cs=Math.min(_cs+1,it.length-1)}else if(e.key==='ArrowUp'){e.preventDefault();_cs=Math.max(_cs-1,0)}else if(e.key==='Tab'&&it[_cs]){e.preventDefault();qi.value=it[_cs].dataset.c||it[_cs].textContent;qi.oninput();return}else return;hl()};
omni.onsubmit=function(e){e.preventDefault();var raw=qi.value.trim(),v=raw;if(!v){var s0=_sg()[_cs];if(s0&&s0.dataset.p)navpage(s0.dataset.p);return}
  var sh=_sg()[_cs];if(sh&&sh.dataset.n){sav(sh.dataset.n,raw);return}if(sh&&sh.dataset.g){gsearch();return}
  if(agv()=='note'||agv()=='task'){sav(agv(),raw);return}
  var pm=PAGES.filter(function(p){return p[1]===v||p[0]===v||p[0]==='/'+v});if(pm.length){qi.value='';navpage(pm[0][0]);return}
  if(views['/'+v]){go('/'+v);qi.value='';return}
  /* Enter takes the HIGHLIGHTED suggestion (pages first in DOM = first by default) — what you see is what runs */
  var sg=_sg();
  if(sg.length&&!/^\d+$/.test(v)&&!_cmds.some(function(c){return c[0]===v.split(' ')[0]})){var s=sg[_cs]||sg[0];
    if(s.dataset.p){qi.value='';navpage(s.dataset.p);return}
    if(s.dataset.c&&s.dataset.c.slice(0,8)==='web http'){window.open(s.dataset.c.slice(4),'_blank');qi.value='';qi.oninput();return}
    if(s.dataset.c)v=raw=s.dataset.c;}
  var tok=v.split(' ')[0],isagent=false;if(sh&&sh.dataset.a||!/^\d+$/.test(v)&&!_cmds.some(function(c){return c[0]===tok})){isagent=true;qh.textContent='→ '+(dev.value?dev.value+' · ':'')+AGO[AG][1]+': '+raw;qh.style.color='#4af';v=(dev.value?'ssh '+dev.value+' a ':'')+agv()+' '+raw+(dev.value?' ; echo --- windows --- ; tmux lsw -t a 2>&1 | tail -8':'');}else if(dev.value)v='ssh '+dev.value+' a '+v;qh.style.color='#345';
  var dv=dev.value;if(isagent)fetch('/api/savep',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'q='+encodeURIComponent((dv||'local')+'\t'+agv()+'\t'+raw)});
  qo.innerHTML='<div style="padding:10px 16px;color:#fa0;font-size:17px">⏳ '+(dv?'sending to '+dv+' via ssh':'running')+'…</div><div style="padding:0 16px;color:#456;font-size:13px">a '+v.replace(/</g,'&lt;')+'</div>';
  fetch('/api/omni',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'q='+encodeURIComponent(v)}).then(function(r){return r.text()}).then(function(h){qi.value='';qi.style.height='auto';
    if(h&&/not a terminal|open terminal failed/i.test(h))h+='<div style="padding:8px 16px;color:#fa0;font-size:14px">ℹ sent — the new window in the list above confirms it launched on '+(dv||'remote')+'. the “not a terminal” is just the remote’s older <b>a</b> attaching a TTY over ssh; update for a clean report: <b>a ssh '+dv+' a u</b></div>';
    else if(h&&/No route to host|Connect failed|Connection refused|exited:|timed out|Could not resolve/i.test(h))h+='<div style="padding:8px 16px;color:#f80;font-size:14px">ℹ '+(dv||'host')+' is unreachable at this address — it may be offline, or this entry’s IP is stale. try its other entry (e.g. the -wan vs -lan variant), or check the device is on.</div>';
    if(isagent){var ms=(h||'').match(/(?:claude|codex|gemini|grok)-[^\s(<:]+/g),win=ms?ms[ms.length-1]:'',wt=win?(dv?'ssh:'+dv+':'+win:win):'';
      h=(h||'')+'<div style="padding:8px 16px;color:#6a6;font-size:14px">↳ prompt saved to adata/git/prompts.log</div>';
